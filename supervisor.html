<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Supervisor</title>

<style>
body{
    font-family: Arial;
    background:#f5f5f5;
    padding:20px;
}

table{
    width:100%;
    border-collapse: collapse;
    background:white;
}

th, td{
    padding:10px;
    border:1px solid #ddd;
    text-align:left;
}

th{
    background:#222;
    color:white;
}

button{
    padding:10px 15px;
    margin-bottom:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Painel Supervisor</h1>

<button onclick="carregar()">Atualizar</button>

<button onclick="baixarCSV()">Exportar CSV</button>

<table>
<thead>
<tr>
<th>Matrícula</th>
<th>Nome</th>
<th>Tempo Logado</th>
<th>Tempo Pausa</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tabela"></tbody>

</table>

<script>
const API = "http://127.0.0.1:8000";

const auth = btoa("supervisor:senha123");

function fmt(seg){
    const h = Math.floor(seg / 3600);
    const m = Math.floor((seg % 3600) / 60);
    const s = seg % 60;

    return [h,m,s]
    .map(v => String(v).padStart(2,"0"))
    .join(":");
}

async function carregar(){

    const res = await fetch(`${API}/api/supervisor/hoje`,{
        headers:{
            "Authorization":"Basic " + auth
        }
    });

    const dados = await res.json();

    const tabela = document.getElementById("tabela");

    tabela.innerHTML = "";

    dados.forEach(item => {

        tabela.innerHTML += `
        <tr>
            <td>${item.matricula}</td>
            <td>${item.nome}</td>
            <td>${fmt(item.total_logado_seg)}</td>
            <td>${fmt(item.total_pausa_seg)}</td>
            <td>${item.status}</td>
        </tr>
        `;
    });
}

function baixarCSV(){

    window.open(
        `${API}/api/supervisor/csv`,
        "_blank"
    );
}

carregar();

setInterval(carregar,5000);
</script>

</body>
</html>
