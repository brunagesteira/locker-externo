<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Ponto</title>

<style>
/* ── Reset ───────────────────────────────────────── */
*, *::before, *::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

/* ── Variáveis ───────────────────────────────────── */
:root{
  --bg:#F5F4F0;
  --surface:#FFFFFF;
  --border:#E2E0D8;
  --text:#1A1917;
  --muted:#7A786F;
  --accent:#1A1917;

  --green:#1B7A4A;
  --green-bg:#EAF5EF;

  --amber:#9A5A00;
  --amber-bg:#FEF3E2;

  --red:#C0392B;
  --red-bg:#FDEEEC;

  --font:'DM Mono','Courier New',monospace;
  --font-ui:'DM Sans',system-ui,sans-serif;

  --radius:10px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
}

@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap');

/* ── Body ────────────────────────────────────────── */
body{
  font-family:var(--font-ui);
  background:var(--bg);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
}

/* ── Screens ─────────────────────────────────────── */
.screen{
  display:none;
}

.screen.active{
  display:flex;
  justify-content:center;
  align-items:center;
  width:100%;
}

/* ── Card ────────────────────────────────────────── */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  width:100%;
  max-width:420px;
  padding:2rem;
}

/* ── Header ──────────────────────────────────────── */
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:1.8rem;
}

.logo-icon{
  width:36px;
  height:36px;
  border-radius:8px;
  background:var(--accent);

  display:flex;
  align-items:center;
  justify-content:center;
}

.logo-title{
  font-size:15px;
  font-weight:600;
  color:var(--text);
}

.logo-sub{
  font-size:12px;
  color:var(--muted);
}

/* ── Form ────────────────────────────────────────── */
.form-group{
  margin-bottom:1rem;
}

label{
  display:block;
  margin-bottom:6px;

  font-size:12px;
  font-weight:500;
  color:var(--muted);

  text-transform:uppercase;
  letter-spacing:.04em;
}

input[type=text]{
  width:100%;
  padding:11px 14px;

  border:1px solid var(--border);
  border-radius:var(--radius);

  background:var(--bg);

  font-size:15px;
  font-family:var(--font);

  outline:none;
}

input[type=text]:focus{
  border-color:var(--accent);
  background:var(--surface);
}

/* ── Buttons ─────────────────────────────────────── */
.btn{
  width:100%;
  padding:12px;

  border:none;
  border-radius:var(--radius);

  cursor:pointer;

  font-size:14px;
  font-weight:600;

  transition:.15s;
}

.btn:hover{
  opacity:.9;
}

.btn-dark{
  background:var(--accent);
  color:white;
}

.btn-ghost{
  margin-top:10px;

  background:transparent;
  color:var(--muted);

  border:1px solid var(--border);
}

.btn-pause{
  background:var(--amber-bg);
  color:var(--amber);
  border:1px solid #F5C842;
}

.btn-resume{
  background:var(--green-bg);
  color:var(--green);
  border:1px solid #5CBB8A;
}

.btn-end{
  margin-top:10px;

  background:var(--red-bg);
  color:var(--red);

  border:1px solid #E8A09A;
}

/* ── Error ───────────────────────────────────────── */
.error{
  display:none;
  margin-bottom:12px;

  color:var(--red);
  font-size:13px;
}

/* ── Badge ───────────────────────────────────────── */
.badge{
  display:inline-flex;
  align-items:center;
  gap:6px;

  padding:4px 12px;

  border-radius:999px;

  font-size:12px;
  font-weight:500;
}

.badge-active{
  background:var(--green-bg);
  color:var(--green);
}

.badge-paused{
  background:var(--amber-bg);
  color:var(--amber);
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:currentColor;
}

/* ── Metrics ─────────────────────────────────────── */
.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;

  margin:1.5rem 0;
}

.metric{
  padding:14px;

  border:1px solid var(--border);
  border-radius:var(--radius);

  background:var(--bg);
}

.metric-label{
  margin-bottom:6px;

  font-size:11px;
  color:var(--muted);

  text-transform:uppercase;
}

.metric-value{
  font-family:var(--font);
  font-size:22px;
  font-weight:500;
}

/* ── Sync ────────────────────────────────────────── */
.sync-row{
  margin-top:1rem;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.sync-label{
  display:flex;
  align-items:center;
  gap:6px;

  font-size:11px;
  color:var(--muted);
}

.sync-dot{
  width:7px;
  height:7px;
  border-radius:50%;

  background:var(--green);
}
</style>
</head>

<body>

<!-- ═════════ LOGIN ═════════ -->
<div id="screen-login" class="screen active">

  <div class="card">

    <div class="logo">

      <div class="logo-icon">
        ⏰
      </div>

      <div>
        <div class="logo-title">Registro de Ponto</div>
        <div class="logo-sub">Controle de jornada</div>
      </div>

    </div>

    <div class="form-group">
      <label>Matrícula</label>
      <input type="text" id="inp-matricula" placeholder="Ex: EMP001">
    </div>

    <div class="form-group">
      <label>Nome</label>
      <input type="text" id="inp-nome" placeholder="Seu nome">
    </div>

    <div class="error" id="login-error">
      Informe a matrícula.
    </div>

    <button class="btn btn-dark" onclick="fazerLogin()">
      Entrar
    </button>

    <button class="btn btn-ghost" onclick="window.location.href='supervisor.html'">
      Acesso Instrutor →
    </button>

  </div>

</div>



<script>

const API = "http://127.0.0.1:8000";

async function fazerLogin(){

  const mat = document.getElementById("inp-matricula").value.trim();
  const nome = document.getElementById("inp-nome").value.trim();

  const err = document.getElementById("login-error");

  if(!mat){
    err.style.display = "block";
    err.textContent = "Informe a matrícula.";
    return;
  }

  err.style.display = "none";

  try{

    const res = await fetch(`${API}/api/login`,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        matricula:mat,
        nome:nome || mat
      })
    });

    if(!res.ok){
      throw new Error();
    }

    const data = await res.json();

// salva sessão completa
localStorage.setItem("ponto_session", JSON.stringify({
    matricula: mat,
    nome: nome || mat,
    sessaoId: data.sessao_id,
    logadoSeg: 0,
    pausaSeg: 0,
    emPausa: false
}));

    // redireciona
    window.location.href = "dashboard.html";

  }catch(e){

    console.log(e);

    err.style.display = "block";
    err.textContent = "Erro ao conectar servidor.";

  }
}
</script>




</script>
